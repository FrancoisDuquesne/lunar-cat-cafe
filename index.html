<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cat Café on the Moon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --c-bg:           #050510;
      --c-panel:        rgba(18, 12, 38, 0.94);
      --c-panel-border: rgba(240, 192, 24, 0.35);
      --c-gold:         #f0c018;
      --c-gold-dim:     #a87e0a;
      --c-pink:         #ff88cc;
      --c-blue:         #88ddff;
      --c-text:         #fff0d8;
      --c-text-dim:     #887766;
      --c-green:        #55cc55;
      --blur:           blur(14px);
      --radius:         12px;
      /* game scale – updated by JS to match Phaser ENVELOP scale */
      --gs: 1;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--c-bg);
      overflow: hidden;
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ── UI ROOT ──────────────────────────────────────────────── */
    #ui-root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* ── GLASS BASE ───────────────────────────────────────────── */
    .glass {
      background: var(--c-panel);
      border: 1px solid var(--c-panel-border);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
    }

    /* ── HUD BAR ──────────────────────────────────────────────── */
    #hud {
      position: fixed;
      top: calc(8px * var(--gs));
      left: calc(8px * var(--gs));
      right: calc(8px * var(--gs));
      height: calc(46px * var(--gs));
      border-radius: calc(10px * var(--gs));
      display: flex;
      align-items: center;
      padding: 0 calc(10px * var(--gs));
      pointer-events: auto;
      gap: 2px;
    }

    .hud-stat {
      display: flex;
      align-items: center;
      gap: calc(5px * var(--gs));
      padding: 0 calc(8px * var(--gs));
      white-space: nowrap;
    }

    .hud-icon { font-size: calc(16px * var(--gs)); line-height: 1; }

    .hud-val {
      font-size: calc(16px * var(--gs));
      font-weight: 700;
      color: var(--c-gold);
      font-family: 'Space Mono', monospace;
      min-width: calc(38px * var(--gs));
    }

    .hud-sep {
      width: 1px;
      height: calc(26px * var(--gs));
      background: rgba(240, 192, 24, 0.18);
      flex-shrink: 0;
    }

    /* Tier + ambiance block */
    #hud-tier {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding: 0 calc(10px * var(--gs));
      line-height: 1.3;
    }
    #tier-name    { font-size: calc(11px * var(--gs)); font-weight: 700; color: #ffdd88; }
    #ambiance-val { font-size: calc(10px * var(--gs)); color: #aa9966; }

    /* Center: day progress */
    .hud-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(3px * var(--gs));
      min-width: 0;
    }

    #day-label {
      font-size: calc(10px * var(--gs));
      font-weight: 600;
      color: var(--c-text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #day-bar-track {
      width: calc(160px * var(--gs));
      height: calc(6px * var(--gs));
      background: rgba(255, 255, 255, 0.08);
      border-radius: calc(3px * var(--gs));
      overflow: hidden;
    }

    #day-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: calc(3px * var(--gs));
      background: linear-gradient(90deg, #ffcc66, #ff9933);
      transition: width 0.4s linear;
    }

    #phase-text {
      font-size: calc(10px * var(--gs));
      font-weight: 500;
      color: #ffcc88;
    }

    /* Right buttons */
    .hud-right {
      display: flex;
      align-items: center;
      gap: calc(6px * var(--gs));
      padding-left: calc(8px * var(--gs));
    }

    .hud-btn {
      width: calc(38px * var(--gs));
      height: calc(38px * var(--gs));
      border-radius: calc(10px * var(--gs));
      border: 1px solid rgba(240, 192, 24, 0.35);
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: calc(17px * var(--gs));
      color: var(--c-gold);
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .hud-btn:hover  { background: rgba(240, 192, 24, 0.14); border-color: var(--c-gold); }
    .hud-btn:active { transform: scale(0.93); }
    .hud-btn svg    { width: calc(18px * var(--gs)); height: calc(18px * var(--gs)); }

    /* ── ORDERS STRIP ─────────────────────────────────────────── */
    #orders-strip {
      position: fixed;
      top: calc(62px * var(--gs));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: calc(5px * var(--gs));
      pointer-events: none;
    }

    .order-ticket {
      width: calc(110px * var(--gs));
      font-family: 'Space Mono', monospace;
      box-shadow: 0 calc(3px * var(--gs)) calc(12px * var(--gs)) rgba(0, 0, 0, 0.45);
    }

    .ot-rail {
      height: calc(8px * var(--gs));
      background: #8a8a9a;
      border-radius: calc(3px * var(--gs)) calc(3px * var(--gs)) 0 0;
    }

    .ot-body {
      background: #fffaee;
      padding: calc(6px * var(--gs)) calc(9px * var(--gs)) calc(7px * var(--gs)) calc(12px * var(--gs));
      position: relative;
    }

    .ot-stripe {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: calc(4px * var(--gs));
    }

    .ot-badge {
      position: absolute;
      top: calc(4px * var(--gs)); right: calc(4px * var(--gs));
      font-size: calc(9px * var(--gs));
      color: #aaccff;
      background: rgba(51, 68, 102, 0.9);
      padding: calc(1px * var(--gs)) calc(5px * var(--gs));
      border-radius: calc(3px * var(--gs));
      font-weight: 700;
    }

    .ot-name   { font-size: calc(10px * var(--gs)); font-weight: 700; color: #2a1a08; }
    .ot-status { font-size: calc(9px * var(--gs)); margin-top: calc(2px * var(--gs)); }
    .ot-type   { font-size: calc(8px * var(--gs)); color: #998877; margin-top: calc(1px * var(--gs)); }

    .ot-prog {
      margin-top: calc(4px * var(--gs));
      height: calc(4px * var(--gs));
      background: rgba(0,0,0,0.1);
      border-radius: calc(2px * var(--gs));
      overflow: hidden;
    }
    .ot-prog-fill {
      height: 100%;
      background: #5599cc;
      border-radius: calc(2px * var(--gs));
    }

    /* Torn / perforated bottom edge */
    .ot-fringe {
      height: calc(10px * var(--gs));
      background: radial-gradient(
        circle at 50% 100%,
        transparent calc(6px * var(--gs)),
        #fffaee calc(6px * var(--gs))
      ) 0 0 / calc(12px * var(--gs)) calc(10px * var(--gs)) repeat-x;
    }

    /* ── STORE PANEL ──────────────────────────────────────────── */
    #store-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: calc(300px * var(--gs));
      max-width: 95vw;
      background: rgba(14, 8, 28, 0.97);
      border-left: 1px solid rgba(240, 192, 24, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      transform: translateX(100%);
      transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
    }

    #store-panel.open { transform: translateX(0); }

    .sp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(15px * var(--gs)) calc(18px * var(--gs)) calc(12px * var(--gs));
      border-bottom: 1px solid rgba(240, 192, 24, 0.12);
      flex-shrink: 0;
    }

    .sp-title {
      font-size: calc(16px * var(--gs));
      font-weight: 700;
      color: var(--c-gold);
      letter-spacing: -0.01em;
    }

    .sp-close {
      width: calc(30px * var(--gs)); height: calc(30px * var(--gs));
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border-radius: calc(7px * var(--gs));
      color: #887766;
      font-size: calc(16px * var(--gs));
      transition: background 0.15s, color 0.15s;
    }
    .sp-close:hover { background: rgba(255,255,255,0.07); color: var(--c-text); }

    .sp-tabs {
      display: flex;
      border-bottom: 1px solid rgba(240, 192, 24, 0.12);
      flex-shrink: 0;
    }

    .sp-tab {
      flex: 1;
      padding: calc(10px * var(--gs)) 2px;
      text-align: center;
      font-size: calc(10px * var(--gs));
      font-weight: 700;
      color: #554433;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .sp-tab.active {
      color: var(--c-gold);
      border-bottom-color: var(--c-gold);
      background: rgba(240, 192, 24, 0.04);
    }

    .sp-tab:hover:not(.active) { color: #aa9966; }

    .sp-content {
      flex: 1;
      overflow-y: auto;
      padding: calc(12px * var(--gs)) calc(11px * var(--gs));
      scrollbar-width: thin;
      scrollbar-color: rgba(240,192,24,0.18) transparent;
    }
    .sp-content::-webkit-scrollbar { width: 3px; }
    .sp-content::-webkit-scrollbar-thumb { background: rgba(240,192,24,0.18); border-radius: 2px; }

    /* Store item card */
    .si {
      display: flex;
      gap: calc(10px * var(--gs));
      align-items: center;
      padding: calc(10px * var(--gs)) calc(11px * var(--gs));
      border-radius: calc(9px * var(--gs));
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02);
      margin-bottom: calc(7px * var(--gs));
      transition: border-color 0.15s;
    }

    .si.afford  { border-color: rgba(240,192,24,0.22); background: rgba(240,192,24,0.035); }
    .si.owned   { opacity: 0.45; border-color: rgba(85,204,85,0.25); }
    .si.locked  { opacity: 0.38; border-color: rgba(80,60,40,0.3); }

    .si-icon {
      width: calc(42px * var(--gs)); height: calc(42px * var(--gs));
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: calc(22px * var(--gs));
      background: rgba(255,255,255,0.04);
      border-radius: calc(8px * var(--gs));
    }

    .si-info { flex: 1; min-width: 0; }

    .si-name {
      font-size: calc(13px * var(--gs));
      font-weight: 700;
      color: var(--c-text);
    }

    .si-desc {
      font-size: calc(11px * var(--gs));
      color: #887766;
      margin-top: calc(2px * var(--gs));
      line-height: 1.45;
    }

    .si-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: calc(5px * var(--gs));
      flex-shrink: 0;
    }

    .si-cost {
      font-size: calc(12px * var(--gs));
      font-weight: 700;
      color: var(--c-gold);
      font-family: 'Space Mono', monospace;
    }
    .si-cost.dim { color: #554422; }

    .si-btn {
      padding: calc(6px * var(--gs)) calc(13px * var(--gs));
      border-radius: calc(7px * var(--gs));
      font-size: calc(11px * var(--gs));
      font-weight: 700;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      border: 1px solid rgba(240,192,24,0.35);
      background: rgba(68, 44, 0, 0.9);
      color: var(--c-gold);
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .si-btn:hover:not(:disabled) { background: rgba(120, 80, 0, 0.9); }
    .si-btn:active:not(:disabled) { transform: scale(0.95); }
    .si-btn:disabled { background: rgba(30,15,5,0.9); color: #443322; border-color: transparent; cursor: not-allowed; }
    .si-btn.owned-lbl { background: transparent; color: var(--c-green); border-color: rgba(85,204,85,0.3); cursor: default; }

    /* Section meta / empty */
    .sp-meta  { font-size: calc(11px * var(--gs)); color: var(--c-text-dim); margin-bottom: calc(10px * var(--gs)); }
    .sp-empty { font-size: calc(13px * var(--gs)); color: #aabb88; text-align: center; padding: calc(20px * var(--gs)) 0; }

    /* Decor sub-tabs */
    .sp-subtabs {
      display: flex;
      flex-wrap: wrap;
      gap: calc(5px * var(--gs));
      margin-bottom: calc(10px * var(--gs));
    }
    .sp-subtab {
      padding: calc(4px * var(--gs)) calc(10px * var(--gs));
      border-radius: calc(6px * var(--gs));
      font-size: calc(10px * var(--gs));
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.07);
      color: #776655;
      background: rgba(255,255,255,0.025);
      transition: all 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .sp-subtab.active { color: var(--c-gold); border-color: rgba(240,192,24,0.35); background: rgba(240,192,24,0.07); }
    .sp-subtab:hover:not(.active) { color: #aa9966; }

    /* ── MAIN MENU OVERLAY ────────────────────────────────────── */
    #menu-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      pointer-events: auto;
    }

    #menu-overlay.hidden { display: none; }

    .mo-title-wrap {
      text-align: center;
      margin-bottom: calc(28px * var(--gs));
      animation: floatY 2.6s ease-in-out infinite;
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-9px); }
    }

    .mo-t1 {
      font-size: calc(62px * var(--gs));
      font-weight: 700;
      color: #ff88cc;
      text-shadow: 0 0 60px rgba(255, 68, 170, 0.55), calc(4px * var(--gs)) calc(4px * var(--gs)) 0 #550022;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .mo-t2 {
      font-size: calc(34px * var(--gs));
      font-weight: 600;
      color: #88ddff;
      text-shadow: 0 0 40px rgba(68, 170, 221, 0.45), calc(3px * var(--gs)) calc(3px * var(--gs)) 0 #003355;
      margin-top: calc(5px * var(--gs));
    }

    .mo-sub {
      font-size: calc(13px * var(--gs));
      color: #ffaadd;
      opacity: 0.75;
      margin-top: calc(10px * var(--gs));
      font-style: italic;
    }

    .mo-buttons {
      display: flex;
      flex-direction: column;
      gap: calc(12px * var(--gs));
      align-items: center;
    }

    .mo-btn {
      width: min(calc(260px * var(--gs)), 88vw);
      padding: calc(14px * var(--gs)) calc(32px * var(--gs));
      border-radius: calc(14px * var(--gs));
      font-size: calc(17px * var(--gs));
      font-weight: 700;
      cursor: pointer;
      border: none;
      font-family: 'Space Grotesk', sans-serif;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    }

    .mo-btn-primary {
      background: linear-gradient(135deg, #bb2288, #ff44aa);
      color: #fff;
      box-shadow: 0 4px 28px rgba(255, 68, 170, 0.45), inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .mo-btn-secondary {
      background: rgba(18, 12, 38, 0.85);
      color: #88ddff;
      border: 1px solid rgba(136, 221, 255, 0.4);
      box-shadow: 0 4px 18px rgba(68, 170, 221, 0.18);
    }

    .mo-btn:hover  { transform: scale(1.04) translateY(-2px); }
    .mo-btn:active { transform: scale(0.97); }

    /* Controls card — sits inside #menu-overlay below buttons */
    .mo-controls {
      margin-top: calc(26px * var(--gs));
      padding: calc(14px * var(--gs)) calc(28px * var(--gs));
      background: rgba(8, 4, 20, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: calc(12px * var(--gs));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-align: center;
    }

    .mo-ctrl-title {
      font-size: calc(9px * var(--gs));
      color: #446677;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 700;
      margin-bottom: calc(10px * var(--gs));
    }

    .mo-ctrl-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(6px * var(--gs));
      font-size: calc(11px * var(--gs));
      color: #8aaabb;
      font-family: 'Space Mono', monospace;
      line-height: 2;
    }

    .mo-key {
      display: inline-block;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(136, 221, 255, 0.22);
      border-radius: calc(4px * var(--gs));
      padding: calc(1px * var(--gs)) calc(8px * var(--gs));
      font-size: calc(10px * var(--gs));
      color: #88ddff;
      font-family: 'Space Mono', monospace;
      white-space: nowrap;
    }

    .mo-ctrl-sep {
      color: #334455;
      margin: 0 calc(2px * var(--gs));
    }

    /* ── IN-GAME LEGEND ───────────────────────────────────────── */
    #legend {
      position: fixed;
      bottom: calc(12px * var(--gs));
      right: calc(14px * var(--gs));
      text-align: right;
      pointer-events: none;
    }
    .leg-line {
      font-size: calc(10px * var(--gs));
      color: #2a3344;
      font-family: 'Space Mono', monospace;
      line-height: 2;
    }

    /* ── STORE BACKDROP ──────────────────────────────────────── */
    #store-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 49;
      pointer-events: auto;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.25);
    }

    /* ── TIER PROGRESS CARD ───────────────────────────────────── */
    .sp-tier-card {
      background: rgba(240, 192, 24, 0.06);
      border: 1px solid rgba(240, 192, 24, 0.2);
      border-radius: calc(9px * var(--gs));
      padding: calc(10px * var(--gs)) calc(13px * var(--gs));
      margin-bottom: calc(12px * var(--gs));
    }
    .sp-tier-maxed {
      text-align: center;
      color: var(--c-gold);
      font-size: calc(12px * var(--gs));
      font-weight: 700;
    }
    .sp-tier-row {
      display: flex;
      align-items: center;
      gap: calc(8px * var(--gs));
      margin-bottom: calc(7px * var(--gs));
    }
    .sp-tier-cur  { font-size: calc(11px * var(--gs)); font-weight: 700; color: var(--c-gold); }
    .sp-tier-arrow{ color: #665533; font-size: calc(13px * var(--gs)); }
    .sp-tier-nxt  { font-size: calc(11px * var(--gs)); font-weight: 700; color: #88ddff; }
    .sp-tier-bar-track {
      height: calc(6px * var(--gs));
      background: rgba(255,255,255,0.07);
      border-radius: calc(3px * var(--gs));
      overflow: hidden;
      margin-bottom: calc(5px * var(--gs));
    }
    .sp-tier-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f0c018, #88ddff);
      border-radius: calc(3px * var(--gs));
      transition: width 0.5s ease;
    }
    .sp-tier-hint {
      font-size: calc(10px * var(--gs));
      color: #665533;
      font-family: 'Space Mono', monospace;
    }

    /* ── SVG HUD ICONS ────────────────────────────────────────── */
    .hud-svg {
      width: calc(18px * var(--gs));
      height: calc(18px * var(--gs));
      flex-shrink: 0;
    }

    /* ── UTILITY ──────────────────────────────────────────────── */
    .hidden { display: none !important; }

    @keyframes bump {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    .bump { animation: bump 0.22s ease-out; }

    /* ── PORTRAIT WARNING ─────────────────────────────────────── */
    #rotate-prompt {
      display: none;
    }

    @media (pointer: coarse) and (orientation: portrait) {
      #rotate-prompt {
        display: flex;
        position: fixed;
        inset: 0;
        background: var(--c-bg);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        color: var(--c-text);
        text-align: center;
        padding: 24px;
      }
      #rotate-prompt .rp-icon { font-size: 54px; }
      #rotate-prompt p {
        font-size: 18px;
        font-weight: 600;
        color: var(--c-gold);
      }
      #rotate-prompt small {
        font-size: 13px;
        color: var(--c-text-dim);
        font-family: 'Space Mono', monospace;
      }
    }

    /* ── TOUCH CONTROLS ───────────────────────────────────────── */
    #touch-controls {
      display: none;
    }

    @media (pointer: coarse) and (orientation: landscape) {
      #touch-controls {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 130px;
        pointer-events: none;
        z-index: 25;
        align-items: flex-end;
        padding-bottom: 14px;
      }
      /* Hide keyboard hint legend on touch */
      #legend { display: none !important; }
      #menu-hints { display: none !important; }
    }

    #joy-zone {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 22px;
      padding-bottom: 4px;
      pointer-events: none;
    }

    #joy-base {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid rgba(255, 255, 255, 0.18);
      position: relative;
      flex-shrink: 0;
      pointer-events: auto;
      touch-action: none;
    }

    #joy-knob {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(240, 192, 24, 0.55);
      border: 2px solid rgba(240, 192, 24, 0.85);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #touch-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 30px;
      padding-bottom: 4px;
      gap: 16px;
      pointer-events: none;
    }

    #btn-interact {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(255, 136, 204, 0.18);
      border: 2px solid rgba(255, 136, 204, 0.55);
      color: #ff88cc;
      font-size: 13px;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2px;
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      transition: background 0.08s, transform 0.08s;
    }

    #btn-interact:active {
      background: rgba(255, 136, 204, 0.42);
      transform: scale(0.91);
    }

    #btn-interact .bi-icon { font-size: 22px; line-height: 1; }

    /* Mobile HUD tweaks */
    @media (pointer: coarse) {
      #hud-tier, .hud-sep:nth-of-type(n+3) { display: none; }
      #legend { display: none; }
      .mo-controls { display: none; }
    }
  </style>
</head>
<body>
  <div id="ui-root">

    <!-- ── HUD ─────────────────────────────────────────────── -->
    <div id="hud" class="glass hidden">
      <div class="hud-stat">
        <!-- coin -->
        <svg class="hud-svg" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="9" fill="#f0c018" stroke="#a87e0a" stroke-width="1"/>
          <circle cx="10" cy="10" r="6.5" fill="#d4a018"/>
          <path d="M10 6v8M8 8h3.5a2 2 0 0 1 0 4H8" stroke="#6b4500" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="hud-val" id="stat-money">0</span>
      </div>
      <div class="hud-sep"></div>
      <div class="hud-stat">
        <!-- star / reputation -->
        <svg class="hud-svg" viewBox="0 0 20 20" fill="none">
          <path d="M10 2l2.06 4.18L17 7.27l-3.5 3.41.83 4.82L10 13.06l-4.33 2.44.83-4.82L3 7.27l4.94-.09z" fill="#ffe044" stroke="#cc9900" stroke-width="0.8"/>
        </svg>
        <span class="hud-val" id="stat-rep" style="min-width:32px">0</span>
      </div>
      <div class="hud-sep"></div>
      <div class="hud-stat">
        <!-- cat face -->
        <svg class="hud-svg" viewBox="0 0 20 20" fill="none">
          <polygon points="5,10 7,4 9,9" fill="#ff7a28"/>
          <polygon points="11,9 13,4 15,10" fill="#ff7a28"/>
          <circle cx="10" cy="13" r="6" fill="#ff7a28"/>
          <circle cx="8" cy="12" r="1.3" fill="#222"/>
          <circle cx="12" cy="12" r="1.3" fill="#222"/>
          <circle cx="8.4" cy="11.4" r="0.5" fill="#fff"/>
          <circle cx="12.4" cy="11.4" r="0.5" fill="#fff"/>
          <path d="M8.5 15 Q10 16 11.5 15" stroke="#ff8899" stroke-width="1.1" fill="none" stroke-linecap="round"/>
        </svg>
        <span class="hud-val" id="stat-cat" style="color:#ff9ab0;min-width:46px">80%</span>
      </div>
      <div class="hud-sep"></div>
      <div id="hud-tier">
        <span id="tier-name">Space Shack</span>
        <span id="ambiance-val">✦ 0 ambiance</span>
      </div>
      <div class="hud-center">
        <span id="day-label">Day 1</span>
        <div id="day-bar-track"><div id="day-bar-fill"></div></div>
        <span id="phase-text">Morning</span>
        <span id="time-remaining" style="font-size:calc(10px * var(--gs));opacity:0.85;font-weight:600;letter-spacing:0.05em;color:#ffaa44;">5:00</span>
      </div>
      <div class="hud-right">
        <!-- store (shopping bag) -->
        <button class="hud-btn" id="btn-store" title="Store (F)">
          <svg viewBox="0 0 20 20" fill="none">
            <rect x="3" y="8" width="14" height="10" rx="2" fill="#f0c018" opacity="0.9"/>
            <path d="M7 8 Q7 4 10 4 Q13 4 13 8" stroke="#a87e0a" stroke-width="1.5" fill="none"/>
            <line x1="7" y1="11" x2="13" y2="11" stroke="#6b4500" stroke-width="1" opacity="0.5"/>
          </svg>
        </button>
        <button class="hud-btn" id="btn-menu" title="Main menu">
          <svg viewBox="0 0 20 20" fill="none">
            <line x1="3" y1="6"  x2="17" y2="6"  stroke="#f0c018" stroke-width="2" stroke-linecap="round"/>
            <line x1="3" y1="10" x2="17" y2="10" stroke="#f0c018" stroke-width="2" stroke-linecap="round"/>
            <line x1="3" y1="14" x2="17" y2="14" stroke="#f0c018" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ── ORDERS STRIP ───────────────────────────────────── -->
    <div id="orders-strip"></div>

    <!-- ── STORE BACKDROP ───────────────────────────────────── -->
    <div id="store-backdrop"></div>

    <!-- ── STORE PANEL ────────────────────────────────────── -->
    <div id="store-panel">
      <div class="sp-header">
        <span class="sp-title">
          <svg viewBox="0 0 18 18" fill="none" style="width:16px;height:16px;vertical-align:middle;margin-right:6px">
            <rect x="2" y="7" width="14" height="10" rx="2" fill="#f0c018" opacity="0.9"/>
            <path d="M6 7 Q6 3 9 3 Q12 3 12 7" stroke="#a87e0a" stroke-width="1.5" fill="none"/>
          </svg>Store
        </span>
        <span class="sp-close" id="store-close">&#10005;</span>
      </div>
      <div class="sp-tabs">
        <div class="sp-tab active" data-tab="furnish">Furnish</div>
        <div class="sp-tab" data-tab="kitchen">Kitchen</div>
        <div class="sp-tab" data-tab="staff">Staff</div>
      </div>
      <div class="sp-content" id="store-content"></div>
    </div>

    <!-- ── MAIN MENU OVERLAY ──────────────────────────────── -->
    <div id="menu-overlay" class="hidden">
      <div class="mo-title-wrap">
        <div class="mo-t1">CAT CAFÉ</div>
        <div class="mo-t2">ON THE MOON</div>
        <div class="mo-sub">~ a cozy lunar café ~</div>
      </div>
      <div class="mo-buttons" id="menu-buttons"></div>
      <div class="mo-controls" id="menu-hints">
        <div class="mo-ctrl-title">How to Play</div>
        <div class="mo-ctrl-row"><span class="mo-key">WASD</span> <span class="mo-ctrl-sep">·</span> <span class="mo-key">arrows</span> Move</div>
        <div class="mo-ctrl-row"><span class="mo-key">E</span> Interact — take orders · cook · deliver</div>
        <div class="mo-ctrl-row"><span class="mo-key">F</span> Store <span class="mo-ctrl-sep">·</span> <span class="mo-key">ESC</span> Menu</div>
      </div>
    </div>

    <!-- ── IN-GAME LEGEND (kept for reference, never shown) ── -->
    <div id="legend" class="hidden"></div>

    <!-- ── TOUCH CONTROLS ───────────────────────────────────── -->
    <div id="touch-controls">
      <div id="joy-zone">
        <div id="joy-base">
          <div id="joy-knob"></div>
        </div>
      </div>
      <div id="touch-right">
        <button id="btn-interact">
          <svg class="bi-icon" viewBox="0 0 24 24" fill="none" style="width:22px;height:22px">
            <polygon points="13,2 4,14 11,14 11,22 20,10 13,10" fill="#ff88cc" stroke="#ff44aa" stroke-width="1"/>
          </svg>
          <span>ACT</span>
        </button>
      </div>
    </div>

  </div>

  <!-- ── PORTRAIT WARNING ───────────────────────────────────── -->
  <div id="rotate-prompt">
    <div class="rp-icon">
      <svg viewBox="0 0 48 48" fill="none" style="width:54px;height:54px">
        <rect x="12" y="4" width="24" height="40" rx="4" stroke="#f0c018" stroke-width="2.5" fill="none"/>
        <circle cx="24" cy="38" r="2" fill="#f0c018"/>
        <path d="M20 16 L28 16 M20 20 L28 20" stroke="#f0c018" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M36 24 L42 24 M39 21 L42 24 L39 27" stroke="#f0c018" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p>Rotate to landscape</p>
    <small>Cat Café on the Moon plays best in landscape mode</small>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
